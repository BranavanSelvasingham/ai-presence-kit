<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Presence Kit Vanilla Status Surface</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #20231f;
        --muted: #6f756d;
        --line: rgba(28, 38, 32, 0.14);
        --surface: rgba(255, 255, 255, 0.82);
        --wash: #f5f7f3;
        --green: #315f4d;
        --gold: #8a6f2b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        background: linear-gradient(145deg, #ffffff 0%, var(--wash) 48%, #edf2ed 100%);
        font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(920px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: clamp(16px, 4vw, 42px);
        display: grid;
        align-items: center;
      }

      .surface-grid {
        display: grid;
        grid-template-columns: minmax(260px, 0.85fr) minmax(300px, 1.15fr);
        gap: 14px;
      }

      .panel {
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: clamp(18px, 3vw, 26px);
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 14px;
        font-size: clamp(2rem, 5vw, 3.8rem);
        line-height: 0.98;
        letter-spacing: 0;
      }

      .status-surface {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        min-height: 48px;
        border: 1px solid rgba(28, 38, 32, 0.12);
        border-radius: 8px;
        padding: 11px 12px;
        background: rgba(255, 255, 255, 0.7);
      }

      .status-dot {
        width: 11px;
        height: 11px;
        border-radius: 999px;
        background: var(--green);
        box-shadow: 0 0 0 4px rgba(49, 95, 77, 0.12);
      }

      .status-surface[data-presence-phase="before-output"] .status-dot {
        background: var(--gold);
        box-shadow: 0 0 0 4px rgba(138, 111, 43, 0.16);
      }

      .status-label,
      .status-phase {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status-phase {
        color: var(--muted);
      }

      .message {
        min-height: 92px;
        margin: 0;
        white-space: pre-wrap;
      }

      .evidence {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        margin-top: 16px;
        color: var(--muted);
        font-size: 0.86rem;
      }

      .evidence span {
        min-width: 0;
      }

      @media (max-width: 720px) {
        .surface-grid,
        .evidence {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="surface-grid" aria-label="Vanilla browser status surface presence demo">
        <div class="panel">
          <p class="eyebrow">Renderer agnostic</p>
          <h1>Plain DOM presence</h1>
          <p>
            This route uses the core runtime and adapters directly, then maps snapshots into a status surface without React or the reference face package.
          </p>
          <div
            id="vanillaStatusSurface"
            class="status-surface"
            data-renderer="status-surface"
            data-presence-state="idle"
            data-presence-phase="idle"
            data-presence-attention="none"
            data-presence-event="reset"
            data-presence-before-output="false"
            data-assistant-text-empty="true"
            data-stream-open-ms="none"
            data-first-output-ms="none"
            data-lead-ms="none"
            data-final-state="idle"
            data-has-output="false"
            data-complete="false"
            data-interrupted="false"
          >
            <span class="status-dot" aria-hidden="true"></span>
            <strong id="vanillaStatusLabel" class="status-label">idle</strong>
            <span id="vanillaStatusPhase" class="status-phase">idle</span>
          </div>
          <div class="evidence" aria-label="Trace evidence">
            <span id="vanillaStreamOpen">streamOpenMs=none</span>
            <span id="vanillaFirstOutput">firstOutputMs=none</span>
            <span id="vanillaLead">leadMs=none</span>
            <span id="vanillaFinal">finalState=idle</span>
          </div>
        </div>
        <div class="panel">
          <p class="eyebrow">Assistant output</p>
          <p id="vanillaAssistantText" class="message" data-vanilla-response></p>
        </div>
      </section>
    </main>

    <script src="/packages/core/src/presence-core.js"></script>
    <script src="/packages/adapters/src/runtime-adapter.js"></script>
    <script>
      (() => {
        const {
          PresenceEvent,
          createPresenceRuntime,
          createPresenceTrace,
          presenceControlInputsForSnapshot,
          summarizePresenceTrace,
        } = window.AIPresenceCore;
        const { createChatEventAdapter } = window.AIPresenceAdapters;

        let nowMs = 0;
        let assistantText = "";
        const presence = createPresenceRuntime({ now: () => nowMs });
        const trace = createPresenceTrace({ limit: 16 });
        trace.attach(presence, { includeInitial: false });
        const chatPresence = createChatEventAdapter(presence);

        const surface = document.getElementById("vanillaStatusSurface");
        const statusLabel = document.getElementById("vanillaStatusLabel");
        const statusPhase = document.getElementById("vanillaStatusPhase");
        const response = document.getElementById("vanillaAssistantText");
        const streamOpen = document.getElementById("vanillaStreamOpen");
        const firstOutput = document.getElementById("vanillaFirstOutput");
        const lead = document.getElementById("vanillaLead");
        const final = document.getElementById("vanillaFinal");

        function formatMs(value) {
          return Number.isFinite(Number(value)) ? `${Math.round(Number(value))}ms` : "none";
        }

        function render(snapshot, summary) {
          const inputs = presenceControlInputsForSnapshot(snapshot, { trace, now: nowMs });
          const beforeOutput = inputs.latencyPhase === "before-output" && !summary.hasOutput;
          const assistantTextEmpty = assistantText.length === 0;
          const activeLeadMs = beforeOutput
            ? Math.max(0, nowMs - Number(summary.streamOpenMs || 0))
            : summary.presenceBeforeOutputMs;

          surface.dataset.renderer = "status-surface";
          surface.dataset.presenceState = snapshot.state;
          surface.dataset.presencePhase = inputs.latencyPhase;
          surface.dataset.presenceAttention = inputs.attentionTarget;
          surface.dataset.presenceEvent = snapshot.event;
          surface.dataset.presenceBeforeOutput = String(beforeOutput);
          surface.dataset.assistantTextEmpty = String(assistantTextEmpty);
          surface.dataset.streamOpenMs = formatMs(summary.streamOpenMs);
          surface.dataset.firstOutputMs = beforeOutput ? "none" : formatMs(summary.firstOutputMs);
          surface.dataset.leadMs = formatMs(activeLeadMs);
          surface.dataset.finalState = summary.finalState || snapshot.state;
          surface.dataset.hasOutput = String(summary.hasOutput);
          surface.dataset.complete = String(summary.complete);
          surface.dataset.interrupted = String(summary.interrupted);

          statusLabel.textContent = snapshot.state;
          statusPhase.textContent = inputs.latencyPhase;
          response.textContent = assistantText;
          streamOpen.textContent = `streamOpenMs=${surface.dataset.streamOpenMs}`;
          firstOutput.textContent = `firstOutputMs=${surface.dataset.firstOutputMs}`;
          lead.textContent = `leadMs=${surface.dataset.leadMs}`;
          final.textContent = `finalState=${surface.dataset.finalState}`;
        }

        function step(atMs, event, nextText = assistantText) {
          nowMs = atMs;
          assistantText = nextText;
          const snapshot = chatPresence.handleEvent(event);
          render(snapshot, summarizePresenceTrace(trace));
        }

        const autorun = new URLSearchParams(window.location.search).get("autorun") === "1";
        if (!autorun) {
          render(presence.getSnapshot(), summarizePresenceTrace(trace));
          return;
        }

        step(0, { type: "input", text: "Show a plain status surface." });
        step(160, { type: "pause", text: "Show a plain status surface.", completion: 0.4 });
        step(280, { type: "submit", text: "Show a plain status surface." });
        step(420, { type: "stream-open" });

        window.setTimeout(() => {
          nowMs = 760;
          render(presence.getSnapshot(), summarizePresenceTrace(trace));
        }, 620);

        window.setTimeout(() => {
          step(900, { type: "token", text: "Plain DOM presence stayed visible before this text." }, "Plain DOM presence stayed visible before this text.");
          step(1220, { type: "done" }, assistantText);
          if (summarizePresenceTrace(trace).firstOutputEvent !== PresenceEvent.TOKEN) {
            throw new Error("Vanilla status surface did not record token as first output.");
          }
        }, 900);
      })();
    </script>
  </body>
</html>
